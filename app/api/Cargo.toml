[package]
name = "pastedown-api"
version = "0.1.0"
edition = "2021"

[profile.release]
debug = 2
lto = "thin"
panic = "abort"

[dependencies]
argon2 = "0.6.0-rc.0"
axum = { version = "0.8.4", features = ["macros"] }
chrono = { version = "0.4.41", features = ["serde"] }
deadpool-postgres = "0.14.1"
dotenvy = "0.15.7"
jsonwebtoken = "9.3.1"
rand = "0.9.2"
sea-query = { version = "0.32.6", default-features = false, features = ["backend-postgres", "derive"]}
sea-query-postgres = { version = "0.5.0", features = ["with-uuid"]}
serde = { version = "1.0.219", features = ["derive"] }
snowflake_me = "0.3.1"
tokio = { version = "1.45.0", default-features = false, features = ["macros", "rt-multi-thread", "signal", "parking_lot"] }
tower = "0.5.2"
tower-http = { version = "0.6.4", features = ["catch-panic", "cors", "timeout", "trace", "compression-br", "compression-gzip"] }
tracing = "0.1.41"
tracing-subscriber = {version = "0.3.19", features = ["env-filter"] }
ts-rs = "11.0.1"
uuid = { version = "1.16.0", features = ["v4", "fast-rng", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }

[build-dependencies]
chrono = "0.4.40"
